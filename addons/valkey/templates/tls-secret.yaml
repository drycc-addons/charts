{{- if .Values.tls.enabled }}
{{- $secretName := include "valkey.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $clusterName := printf "valkey-%s" (include "valkey.name" .) }}
  {{- $ns := .Release.Namespace }}
  {{- $days := int .Values.tls.certValidityDays }}
  {{- $ca := genCA (printf "%s-ca" $clusterName) $days }}
  {{- $altNames := list $clusterName (printf "%s.%s" $clusterName $ns) (printf "%s.%s.svc" $clusterName $ns) (printf "%s.%s.svc.cluster.local" $clusterName $ns) (printf "*.%s.%s.svc.cluster.local" $clusterName $ns) (printf "*.%s" $clusterName) "localhost" "127.0.0.1" }}
  {{- $crt := genSignedCert $clusterName (list "127.0.0.1") $altNames $days $ca }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $crt.Cert | b64enc | quote }}
  tls.key: {{ $crt.Key | b64enc | quote }}
  {{- end }}
{{- end }}
