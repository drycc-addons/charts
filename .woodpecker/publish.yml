labels:
  type: exec
  platform: linux/amd64

steps:
- name: build-and-publish
  image: bash
  commands:
  - export VERSION=$(sed 's#v##' <<< $CI_COMMIT_TAG)
  - export CHART_VERSION=$([ -z $CI_COMMIT_TAG ] && echo 1.0.0 || echo $VERSION)
  - export APP_VERSION=$([ -z $CI_COMMIT_TAG ] && echo $CI_COMMIT_SHA || echo $VERSION)
  - make build
  - echo $CONTAINER_PASSWORD | helm registry login $DRYCC_REGISTRY -u $CONTAINER_USERNAME --password-stdin
  - |
    REGISTRY_PATH=$([ -z "$CI_COMMIT_TAG" ] && echo "$DRYCC_REGISTRY/$CI_REPO_OWNER/charts-testing" || echo "$DRYCC_REGISTRY/$CI_REPO_OWNER/charts")
    for pkg in _dist/*.tgz; do
      helm push "$pkg" "oci://$REGISTRY_PATH"
    done
  environment:
    DRYCC_REGISTRY:
      from_secret: drycc_registry
    CONTAINER_USERNAME:
      from_secret: container_username
    CONTAINER_PASSWORD:
      from_secret: container_password
  when:
    event:
    - push
    - tag
