- name: "micro"
  description: "250m CPU / 512Mi memory"
  defaults:
    imagePullPolicy: IfNotPresent
    replicas: 1
    persistence:
      enabled: false
  overrides:
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 125m
        memory: 256Mi
    service:
      enabled: true
      type: ClusterIP
  allowCreate:
  - "image.repository"
  - "image.tag"
  - "command"
  - "args"
  - "env"
  - "ports"
  - "healthCheck"
  - "service.ports"
  - "replicas"
  - "persistence.enabled"
  - "persistence.size"
  - "persistence.storageClassName"
  - "persistence.mountPath"
  allowUpdate:
  - "image.tag"
  - "command"
  - "args"
  - "env"
  - "ports"
  - "healthCheck"
  - "service.ports"
  - "replicas"

