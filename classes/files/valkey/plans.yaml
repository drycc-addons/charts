- name: "micro"
  description: "1 GB per node, Standalone"
  defaults: {}
  overrides:
    shards: 1
    replicas: 0
    workloadType: StatefulSet
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: ""
    exporter:
      enabled: true
  allowCreate:
  - "users"
  - "config"
  - "tls.enabled"
  allowUpdate:
  - "users"
  - "config"
  - "tls.enabled"

