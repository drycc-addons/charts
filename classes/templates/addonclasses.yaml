{{- include "classes.iterate" (dict "root" . "body" "classes.addonclass") -}}
{{- define "classes.addonclass" -}}
{{- $values := .values -}}
---
apiVersion: addons.drycc.cc/v1
kind: AddonClass
metadata:
  name: {{ $values.chart }}
  labels:
    app.kubernetes.io/name: {{ $values.chart }}
    app.kubernetes.io/component: addonclass
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  description: {{ $values.description | quote }}
  storageModel: {{ default "bundle" $values.storageModel | quote }}
  {{- if $values.multiplierFrom }}
  multiplierFrom: {{ $values.multiplierFrom | quote }}
  {{- end }}
  {{- if $values.visiblePaths }}
  visiblePaths:
{{ $values.visiblePaths | toYaml | indent 4 }}
  {{- end }}
  targetResource:
    apiVersion: addons.drycc.cc/v1
    kind: {{ $values.kind }}
  plans:
{{- range $values.plans }}
    - name: {{ .name | quote }}
      description: {{ .description | quote }}
      defaults:
{{ .defaults | toYaml | indent 8 }}
      overrides:
{{ .overrides | toYaml | indent 8 }}
      allowCreate:
{{ .allowCreate | toYaml | indent 8 }}
      allowUpdate:
{{ .allowUpdate | toYaml | indent 8 }}
{{- end }}
{{ end -}}
