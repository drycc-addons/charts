apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: addonclasses.addons.drycc.cc
spec:
  group: addons.drycc.cc
  scope: Cluster
  names:
    plural: addonclasses
    singular: addonclass
    kind: AddonClass
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [description, targetResource, plans]
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 512
                storageModel:
                  type: string
                  enum: [custom, bundle]
                  default: bundle
                multiplierFrom:
                  type: string
                  minLength: 1
                  maxLength: 128
                visiblePaths:
                  type: array
                  items:
                    type: string
                    minLength: 1
                targetResource:
                  type: object
                  required: [apiVersion, kind]
                  properties:
                    apiVersion:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      minLength: 1
                    metadata:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                plans:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - description
                      - defaults
                      - overrides
                      - allowCreate
                      - allowUpdate
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 64
                      description:
                        type: string
                        minLength: 1
                        maxLength: 128
                      defaults:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      overrides:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      allowCreate:
                        type: array
                        items:
                          type: string
                          minLength: 1
                      allowUpdate:
                        type: array
                        items:
                          type: string
                          minLength: 1
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetResource.kind
        - name: Plans
          type: integer
          jsonPath: .spec.plans.size()
